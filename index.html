<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sibling Tours - Premium Experiences</title>
    
    <!-- Memuat Tailwind CSS untuk Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Memuat jsPDF untuk pembuatan file PDF Invoice -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            scroll-behavior: smooth;
            background-color: #f9fafb;
        }

        .hero-gradient {
            background: linear-gradient(to bottom, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0.7) 100%);
        }

        .glass-nav {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1; 
        }
        ::-webkit-scrollbar-thumb {
            background: #888; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #555; 
        }

        /* Loading Spinner */
        .spinner {
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top: 3px solid #fff;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
            vertical-align: middle;
            margin-right: 8px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="text-gray-800 antialiased">

    <!-- Kontainer Aplikasi Utama -->
    <div id="app"></div>

    <!-- Modal Custom untuk Peringatan (Menggantikan Alert standar) -->
    <div id="customModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black bg-opacity-50 transition-opacity">
        <div class="bg-white rounded-xl shadow-2xl p-6 max-w-sm w-full mx-4 transform scale-95 transition-transform duration-300" id="modalContent">
            <h3 id="modalTitle" class="text-lg font-bold text-gray-900 mb-2">Pemberitahuan</h3>
            <p id="modalMessage" class="text-gray-600 mb-6">Pesan di sini.</p>
            <div class="flex justify-end gap-3" id="modalActions">
                <button onclick="closeModal()" class="px-4 py-2 bg-gray-200 text-gray-800 rounded-lg hover:bg-gray-300 transition">Tutup</button>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. PENGATURAN KREDENSIAL & DATABASE
        // ==========================================
        
        // MASUKKAN KREDENSIAL SUPABASE ANDA DI SINI UNTUK MENSINKRONISASIKAN ANTAR DEVICE
        const SUPABASE_URL = "ISI_DENGAN_URL_SUPABASE_ANDA"; 
        const SUPABASE_KEY = "ISI_DENGAN_ANON_KEY_SUPABASE_ANDA"; 
        
        const useSupabase = (SUPABASE_URL && SUPABASE_KEY && !SUPABASE_URL.startsWith("ISI_DENGAN_"));

        // Hash SHA-256 untuk kata sandi default: admin
        const DEFAULT_PASS_HASH = "8c6976e5b5410415bde908bd4dee15dfb167a9c873fc4bb8a81f6f2ab448a918"; 
        const LEGACY_SQL_HASH = "24073644934d71597405e3f46f3630f1b204618a8047fd3f5b7194685718a7b0";

        // ==========================================
        // 2. DATA BAWAAN (DEFAULT FALLBACK)
        // ==========================================
        const defaultSettings = {
            logo: 'Sibling Tours',
            whatsapp: '+6281234567890',
            admin_username: 'admin',
            admin_password: DEFAULT_PASS_HASH
        };

        const defaultTours = [
            {
                id: 'tour-1',
                title: 'Komodo Premium 3D2N',
                price: '3.500.000',
                duration: '3 Hari 2 Malam',
                thumbnail: 'https://images.unsplash.com/photo-1518548419970-58e3b4079ab2?auto=format&fit=crop&w=800&q=80',
                description: 'Jelajahi keajaiban Taman Nasional Komodo dengan kapal Phinisi premium kami. Nikmati pemandangan spektakuler, snorkeling di perairan jernih, dan bertatap muka dengan naga purba Komodo.',
                highlights: 'Pulau Padar, Pink Beach, Pulau Komodo, Manta Point'
            },
            {
                id: 'tour-2',
                title: 'Sailing Komodo 1 Day',
                price: '1.250.000',
                duration: '1 Hari Penuh',
                thumbnail: 'https://images.unsplash.com/photo-1512100356356-de1b84283e18?auto=format&fit=crop&w=800&q=80',
                description: 'Paket singkat namun padat untuk Anda yang memiliki waktu terbatas. Kunjungi destinasi paling ikonik di Labuan Bajo dalam satu hari penuh menggunakan Speedboat cepat.',
                highlights: 'Pulau Padar, Pulau Komodo, Pink Beach'
            }
        ];

        // State Aplikasi
        let state = {
            tours: [...defaultTours],
            settings: {...defaultSettings},
            bookings: [],
            isLoggedIn: false
        };

        // ==========================================
        // 3. FUNGSI UTILITAS (HELPER)
        // ==========================================
        
        function isSha256(str) {
            return typeof str === 'string' && str.length === 64 && /^[0-9a-fA-F]+$/.test(str);
        }

        // Fungsi Hash sederhana menggunakan Web Crypto API
        async function sha256(message) {
            const msgBuffer = new TextEncoder().encode(message);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        // Fungsi Custom Modal
        function showModal(title, message, isError = false) {
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalMessage').textContent = message;
            document.getElementById('modalTitle').className = isError ? "text-lg font-bold text-red-600 mb-2" : "text-lg font-bold text-blue-600 mb-2";
            
            const modal = document.getElementById('customModal');
            const content = document.getElementById('modalContent');
            
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            setTimeout(() => {
                content.classList.remove('scale-95');
                content.classList.add('scale-100');
            }, 10);
        }

        function closeModal() {
            const modal = document.getElementById('customModal');
            const content = document.getElementById('modalContent');
            
            content.classList.remove('scale-100');
            content.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            }, 300);
        }

        // Format Nomor WhatsApp Internasional
        function getCleanWhatsAppNumber(phoneStr) {
            if (!phoneStr) return "";
            let cleaned = phoneStr.replace(/\s+/g, '').replace(/-/g, '').replace(/\(/g, '').replace(/\)/g, '');
            if (cleaned.startsWith('+')) {
                return cleaned.substring(1);
            }
            if (cleaned.startsWith('08')) {
                return '62' + cleaned.substring(1);
            }
            return cleaned;
        }

        // Fungsi Simulasi Fetch/Load Data
        async function loadData() {
            if (useSupabase) {
                // Di sini Anda bisa memanggil fetch ke REST API Supabase
                // Untuk draf ini, kita asumsikan data Supabase kosong agar fallback berfungsi
                console.log("Supabase Mode Active - Fetching...");
                // Simulasi tabel kosong di database baru
                let fetchedTours = []; 
                let fetchedSettings = [];

                if (fetchedTours.length === 0) {
                    state.tours = [...defaultTours];
                }
                if (fetchedSettings.length === 0) {
                    state.settings = {...defaultSettings};
                }
            } else {
                // LocalStorage Mode
                const localTours = JSON.parse(localStorage.getItem('sibling_tours'));
                const localSettings = JSON.parse(localStorage.getItem('sibling_settings'));
                
                if (localTours && localTours.length > 0) state.tours = localTours;
                if (localSettings) state.settings = localSettings;
            }
        }

        // ==========================================
        // 4. SISTEM RENDER TAMPILAN (ROUTING)
        // ==========================================
        
        function renderApp(view = 'home', param = null) {
            const app = document.getElementById('app');
            window.scrollTo(0, 0);

            if (view === 'home') {
                app.innerHTML = renderNavbar() + renderHome() + renderFooter();
            } else if (view === 'tour') {
                app.innerHTML = renderNavbar() + renderTourDetail(param) + renderFooter();
            } else if (view === 'admin-login') {
                app.innerHTML = renderAdminLogin();
            } else if (view === 'admin-dashboard') {
                if (!state.isLoggedIn) return renderApp('admin-login');
                app.innerHTML = renderAdminDashboard();
            }
        }

        function renderNavbar() {
            return `
                <nav class="fixed w-full z-40 glass-nav">
                    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                        <div class="flex justify-between items-center h-20">
                            <div class="flex-shrink-0 cursor-pointer" onclick="renderApp('home')">
                                <h1 class="text-2xl font-bold text-blue-900 tracking-wider">${state.settings.logo}</h1>
                            </div>
                            <div class="hidden md:block">
                                <div class="ml-10 flex items-center space-x-8">
                                    <a href="#" onclick="renderApp('home')" class="text-gray-800 hover:text-blue-600 font-medium transition">Beranda</a>
                                    <a href="#tours" onclick="renderApp('home')" class="text-gray-800 hover:text-blue-600 font-medium transition">Paket Wisata</a>
                                    <button onclick="renderApp('admin-login')" class="bg-blue-600 text-white px-5 py-2 rounded-full font-medium hover:bg-blue-700 transition shadow-md">
                                        Login Admin
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </nav>
            `;
        }

        function renderFooter() {
            return `
                <footer class="bg-gray-900 text-white py-12 mt-12">
                    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
                        <h2 class="text-2xl font-bold mb-4">${state.settings.logo}</h2>
                        <p class="text-gray-400 mb-6">Pengalaman tak terlupakan di Labuan Bajo.</p>
                        <p class="text-sm text-gray-500">&copy; ${new Date().getFullYear()} ${state.settings.logo}. All rights reserved.</p>
                    </div>
                </footer>
            `;
        }

        function renderHome() {
            let toursHTML = state.tours.map(tour => `
                <div class="bg-white rounded-2xl overflow-hidden shadow-lg hover:shadow-xl transition-shadow duration-300 group cursor-pointer" onclick="renderApp('tour', '${tour.id}')">
                    <div class="relative h-64 overflow-hidden">
                        <img src="${tour.thumbnail}" alt="${tour.title}" loading="lazy" class="w-full h-full object-cover transform group-hover:scale-110 transition-transform duration-500">
                        <div class="absolute top-4 right-4 bg-white/90 backdrop-blur text-blue-900 font-bold px-4 py-2 rounded-full shadow">
                            Rp ${tour.price}
                        </div>
                    </div>
                    <div class="p-6">
                        <div class="flex justify-between items-center mb-2">
                            <h3 class="text-xl font-bold text-gray-900 group-hover:text-blue-600 transition">${tour.title}</h3>
                        </div>
                        <p class="text-gray-500 text-sm mb-4 flex items-center">
                            <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            ${tour.duration}
                        </p>
                        <p class="text-gray-600 line-clamp-2">${tour.description}</p>
                    </div>
                </div>
            `).join('');

            return `
                <!-- Hero Section -->
                <div class="relative h-screen flex items-center justify-center">
                    <div class="absolute inset-0 z-0">
                        <img src="https://images.unsplash.com/photo-1588668214407-6ea9a6d8c272?auto=format&fit=crop&w=1920&q=80" alt="Labuan Bajo" loading="lazy" class="w-full h-full object-cover">
                        <div class="absolute inset-0 hero-gradient"></div>
                    </div>
                    <div class="relative z-10 text-center px-4 max-w-4xl mx-auto mt-16">
                        <h1 class="text-4xl md:text-6xl font-bold text-white mb-6 leading-tight">Jelajahi Surga Tersembunyi Bersama Kami</h1>
                        <p class="text-lg md:text-xl text-gray-200 mb-10">Temukan pengalaman berlayar premium di Taman Nasional Komodo dengan layanan kelas satu.</p>
                        <a href="#tours" class="inline-block bg-blue-600 text-white font-semibold px-8 py-4 rounded-full hover:bg-blue-700 transition transform hover:-translate-y-1 shadow-lg">
                            Lihat Paket Wisata
                        </a>
                    </div>
                </div>

                <!-- Tours Section -->
                <div id="tours" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-20">
                    <div class="text-center mb-16">
                        <h2 class="text-3xl md:text-4xl font-bold text-gray-900 mb-4">Destinasi Populer</h2>
                        <div class="w-24 h-1 bg-blue-600 mx-auto rounded"></div>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                        ${toursHTML}
                    </div>
                </div>
            `;
        }

        function renderTourDetail(tourId) {
            const tour = state.tours.find(t => t.id === tourId);
            if (!tour) return `<div class="pt-32 text-center text-2xl">Tur tidak ditemukan.</div>`;

            return `
                <div class="pt-20">
                    <!-- Banner Image with Lazy Loading -->
                    <div class="w-full h-[50vh] relative">
                        <img src="${tour.thumbnail}" alt="${tour.title}" loading="lazy" class="w-full h-full object-cover">
                        <div class="absolute inset-0 bg-black bg-opacity-40 flex items-center justify-center">
                            <h1 class="text-4xl md:text-5xl font-bold text-white text-center px-4">${tour.title}</h1>
                        </div>
                    </div>

                    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 flex flex-col lg:flex-row gap-12">
                        <!-- Informasi Detail -->
                        <div class="lg:w-2/3">
                            <div class="bg-white p-8 rounded-2xl shadow-sm border border-gray-100">
                                <h2 class="text-2xl font-bold text-gray-900 mb-4">Tentang Perjalanan Ini</h2>
                                <p class="text-gray-600 leading-relaxed mb-8 text-lg">${tour.description}</p>
                                
                                <h3 class="text-xl font-bold text-gray-900 mb-3">Highlight Destinasi</h3>
                                <div class="bg-blue-50 p-4 rounded-xl text-blue-900 font-medium">
                                    ${tour.highlights}
                                </div>
                            </div>
                        </div>

                        <!-- Form Booking -->
                        <div class="lg:w-1/3">
                            <div class="bg-white p-8 rounded-2xl shadow-xl sticky top-28 border border-gray-100">
                                <h3 class="text-2xl font-bold text-gray-900 mb-2">Pesan Sekarang</h3>
                                <p class="text-blue-600 font-bold text-xl mb-6">Rp ${tour.price} <span class="text-sm text-gray-500 font-normal">/ pax</span></p>
                                
                                <form id="bookingForm" onsubmit="handleBookingSubmit(event, '${tour.id}')" class="space-y-4">
                                    <div>
                                        <label class="block text-sm font-medium text-gray-700 mb-1">Nama Lengkap</label>
                                        <input type="text" id="b_name" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
                                    </div>
                                    <div>
                                        <label class="block text-sm font-medium text-gray-700 mb-1">Tanggal Keberangkatan</label>
                                        <input type="date" id="b_date" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
                                    </div>
                                    <div>
                                        <label class="block text-sm font-medium text-gray-700 mb-1">Jumlah Peserta</label>
                                        <input type="number" id="b_guests" min="1" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
                                    </div>
                                    <button type="submit" id="btnSubmitBooking" class="w-full bg-blue-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-blue-700 transition shadow-md flex justify-center items-center mt-6">
                                        Submit Booking & Unduh PDF
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        async function handleBookingSubmit(event, tourId) {
            event.preventDefault();
            const btn = document.getElementById('btnSubmitBooking');
            
            // 1. Tampilkan status Loading (Cegah double click)
            const originalText = btn.innerHTML;
            btn.innerHTML = `<span class="spinner"></span> Memproses...`;
            btn.disabled = true;
            btn.classList.add('opacity-75', 'cursor-not-allowed');

            const tour = state.tours.find(t => t.id === tourId);
            const name = document.getElementById('b_name').value;
            const date = document.getElementById('b_date').value;
            const guests = document.getElementById('b_guests').value;
            
            const bookingId = 'INV-' + Math.floor(Math.random() * 1000000);

            try {
                // 2. Proses Generate PDF Menggunakan jsPDF
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();
                
                doc.setFontSize(22);
                doc.setTextColor(30, 58, 138); // Blue-900
                doc.text(state.settings.logo, 20, 20);
                
                doc.setFontSize(16);
                doc.setTextColor(0, 0, 0);
                doc.text("INVOICE PEMESANAN (DRAFT)", 20, 40);
                
                doc.setFontSize(12);
                doc.text(`Booking ID: ${bookingId}`, 20, 50);
                doc.text(`Nama: ${name}`, 20, 60);
                doc.text(`Paket: ${tour.title}`, 20, 70);
                doc.text(`Tanggal: ${date}`, 20, 80);
                doc.text(`Jumlah Pax: ${guests} Orang`, 20, 90);
                
                doc.setFontSize(10);
                doc.setTextColor(100, 100, 100);
                doc.text("*Harap lampirkan dokumen ini saat menghubungi admin di WhatsApp.", 20, 110);
                
                // Unduh PDF
                doc.save(`${bookingId}_${name.replace(/\s+/g, '_')}.pdf`);

                // 3. Format Pesan WhatsApp & Redirect (Bypass Popup Blocker)
                const adminWa = getCleanWhatsAppNumber(state.settings.whatsapp);
                const message = `Halo Admin ${state.settings.logo},\n\nSaya ingin mengkonfirmasi pesanan saya.\n\n*Detail Pesanan:*\n- Nama: ${name}\n- Paket: ${tour.title}\n- Tanggal: ${date}\n- Jumlah: ${guests} pax\n\n_Saya akan melampirkan file PDF invoice di chat ini secara manual._`;
                
                const waUrl = `https://wa.me/${adminWa}?text=${encodeURIComponent(message)}`;
                
                // Buka di tab baru jika memungkinkan, jika diblokir oleh browser, alihkan di tab yang sama
                let waWindow = window.open(waUrl, '_blank');
                if (!waWindow) {
                    window.location.href = waUrl;
                }

                showModal("Berhasil!", "PDF berhasil diunduh. Silakan lampirkan PDF tersebut ke WhatsApp Admin.");
                
            } catch (error) {
                console.error(error);
                showModal("Error", "Gagal memproses pesanan. Silakan coba lagi.", true);
            } finally {
                // Kembalikan tombol ke kondisi semula
                btn.innerHTML = originalText;
                btn.disabled = false;
                btn.classList.remove('opacity-75', 'cursor-not-allowed');
            }
        }

        function renderAdminLogin() {
            return `
                <div class="min-h-screen flex items-center justify-center bg-gray-100">
                    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md">
                        <div class="text-center mb-8">
                            <h2 class="text-2xl font-bold text-blue-900 mb-2">Admin Login</h2>
                            <p class="text-gray-500">Masuk untuk mengelola web tour</p>
                        </div>
                        <form onsubmit="handleLogin(event)" class="space-y-6">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                                <input type="text" id="adminUser" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                                <input type="password" id="adminPass" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                            </div>
                            <button type="submit" class="w-full bg-blue-900 text-white font-bold py-3 rounded-lg hover:bg-blue-800 transition">Masuk Dashboard</button>
                        </form>
                        <div class="mt-6 text-center">
                            <a href="#" onclick="renderApp('home')" class="text-sm text-blue-600 hover:underline">Kembali ke Beranda</a>
                        </div>
                    </div>
                </div>
            `;
        }

        async function handleLogin(e) {
            e.preventDefault();
            const user = document.getElementById('adminUser').value;
            const pass = document.getElementById('adminPass').value;
            
            const savedUser = state.settings.admin_username || 'admin';
            const savedPass = state.settings.admin_password || DEFAULT_PASS_HASH;
            
            let loginSuccessful = false;
            const enteredHash = await sha256(pass);

            // Logika Validasi Password (mendukung Hash baru dan Failsafe)
            if (isSha256(savedPass)) {
                loginSuccessful = (user === savedUser && enteredHash === savedPass);
                
                // Failsafe: Jika DB pakai hash lama, tapi user ketik "admin"
                if (!loginSuccessful && user === savedUser && savedPass === LEGACY_SQL_HASH && pass === 'admin') {
                    loginSuccessful = true;
                }
            } else {
                loginSuccessful = (user === savedUser && pass === savedPass);
            }

            if (loginSuccessful) {
                state.isLoggedIn = true;
                renderApp('admin-dashboard');
            } else {
                showModal("Gagal Login", "Username atau password salah!", true);
            }
        }

        function renderAdminDashboard() {
            return `
                <div class="min-h-screen bg-gray-100 flex">
                    <!-- Sidebar -->
                    <aside class="w-64 bg-blue-900 text-white min-h-screen p-6">
                        <h2 class="text-2xl font-bold mb-8">Web Admin</h2>
                        <nav class="space-y-4">
                            <a href="#" class="block px-4 py-2 bg-blue-800 rounded-lg">Manajemen Tur</a>
                            <a href="#" onclick="logout()" class="block px-4 py-2 text-red-300 hover:bg-blue-800 rounded-lg transition mt-10">Logout</a>
                        </nav>
                    </aside>
                    <!-- Content -->
                    <main class="flex-1 p-8">
                        <div class="bg-white rounded-xl shadow p-6">
                            <div class="flex justify-between items-center mb-6">
                                <h2 class="text-2xl font-bold text-gray-800">Daftar Paket Wisata</h2>
                                <button class="bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700 transition">
                                    + Tambah Paket
                                </button>
                            </div>
                            <div class="overflow-x-auto">
                                <table class="w-full text-left border-collapse">
                                    <thead>
                                        <tr class="bg-gray-100 text-gray-600">
                                            <th class="p-3 rounded-tl-lg">Judul Tur</th>
                                            <th class="p-3">Harga</th>
                                            <th class="p-3 rounded-tr-lg">Aksi</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        ${state.tours.map(tour => `
                                            <tr class="border-b hover:bg-gray-50">
                                                <td class="p-3 font-medium">${tour.title}</td>
                                                <td class="p-3 text-gray-600">Rp ${tour.price}</td>
                                                <td class="p-3">
                                                    <button class="text-blue-600 hover:underline mr-3">Edit</button>
                                                    <button class="text-red-600 hover:underline">Hapus</button>
                                                </td>
                                            </tr>
                                        `).join('')}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </main>
                </div>
            `;
        }

        function logout() {
            state.isLoggedIn = false;
            renderApp('home');
        }

        // Inisialisasi Aplikasi Saat Halaman Dimuat
        window.addEventListener('DOMContentLoaded', async () => {
            await loadData(); // Load dari Supabase atau localStorage
            renderApp('home'); // Tampilkan halaman depan
        });

    </script>
</body>
</html>
